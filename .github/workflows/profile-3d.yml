name: GitHub-Profile-3D-Pacman

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "inject_pacman_3d.py"
      - ".github/workflows/profile-3d.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-pacman-contrib
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inject animated Pac-Man into 3D SVG
        run: python inject_pacman_3d.py

      - name: Commit & Push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git commit -m "chore: update 3D Pac-Man contribution graph" || exit 0
          git push



          - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: >
            {
              "backgroundColor": "#060906",
              "foregroundColor": "#39d353",
              "strongColor": "#4ade80",
              "weakColor": "#14532d",
              "radarColor": "#39d353",
              "contribColors": ["#0d160e", "#0e4429", "#006d32", "#26a641", "#39d353"]
            }
